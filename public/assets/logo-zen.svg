<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" shape-rendering="geometricPrecision">
  <!-- Refined Japandi Orbital Enso Circle -->
  <circle cx="50" cy="50" r="42" stroke="#f2eee6" stroke-width="2" stroke-linecap="round" stroke-dasharray="210 20" opacity="0.85"/>
  <!-- Inner Concentric Orbit -->
  <circle cx="50" cy="50" r="28" stroke="#bfb8a8" stroke-width="1" stroke-dasharray="2 6" opacity="0.6"/>
  <!-- Cardinal Alignment Marks -->
  <line x1="50" y1="3" x2="50" y2="8" stroke="#f2eee6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="50" y1="92" x2="50" y2="97" stroke="#f2eee6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="3" y1="50" x2="8" y2="50" stroke="#f2eee6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="92" y1="50" x2="97" y2="50" stroke="#f2eee6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Japanese Vermilion (Shuu-iro) Orbital Satellite -->
  <circle cx="79.7" cy="20.3" r="5" fill="#c85a4e"/>
  <circle cx="79.7" cy="20.3" r="2" fill="#f2eee6"/>
  <!-- Central Calm Core -->
  <circle cx="50" cy="50" r="12" fill="#c85a4e" opacity="0.2"/>
  <circle cx="50" cy="50" r="6" fill="#c85a4e"/>
  <circle cx="50" cy="50" r="2" fill="#f2eee6"/>
</svg>
