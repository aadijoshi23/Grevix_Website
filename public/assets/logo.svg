<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" shape-rendering="geometricPrecision">
  <!-- Outer Orbit Track -->
  <circle cx="50" cy="50" r="42" stroke="#FF4400" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Inner Segmented Precision Ring -->
  <circle cx="50" cy="50" r="31" stroke="#FF4400" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.7"/>
  <!-- Cardinal HUD Telemetry Ticks -->
  <line x1="50" y1="2" x2="50" y2="10" stroke="#FF4400" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="90" x2="50" y2="98" stroke="#FF4400" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="2" y1="50" x2="10" y2="50" stroke="#FF4400" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90" y1="50" x2="98" y2="50" stroke="#FF4400" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Orbital Satellite Unit at 45 Degrees -->
  <circle cx="79.7" cy="20.3" r="6" fill="#FF4400"/>
  <circle cx="79.7" cy="20.3" r="2.5" fill="#FFFFFF"/>
  <!-- Central Core Singularity -->
  <circle cx="50" cy="50" r="16" fill="#FF4400"/>
  <circle cx="50" cy="50" r="7.5" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="3" fill="#FF4400"/>
</svg>
